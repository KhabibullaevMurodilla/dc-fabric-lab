# Leaf-spine data-centre fabric: 2 spines, 3 leaves, BGP-unnumbered underlay,
# BGP EVPN / VXLAN overlay, one dual-homed (EVPN-multihomed) host.
#
# AS plan (eBGP underlay, Cumulus/Facebook-style numbering):
#   spine1, spine2  -> AS 65000 (shared spine AS)
#   leaf1           -> AS 65011
#   leaf2           -> AS 65012
#   leaf3           -> AS 65013
#
# Loopbacks double as BGP router-id and, on leaves, the VXLAN VTEP source.

switches:
  spine1: {asn: 65000, loopback: "10.0.0.101/32", role: spine}
  spine2: {asn: 65000, loopback: "10.0.0.102/32", role: spine}
  leaf1:  {asn: 65011, loopback: "10.0.0.1/32",   role: leaf, vtep: "10.0.0.1"}
  leaf2:  {asn: 65012, loopback: "10.0.0.2/32",   role: leaf, vtep: "10.0.0.2"}
  leaf3:  {asn: 65013, loopback: "10.0.0.3/32",   role: leaf, vtep: "10.0.0.3"}

# Underlay point-to-point links.
#
# NOTE ON "BGP UNNUMBERED": true BGP-unnumbered eBGP (FRR's
# "neighbor <iface> interface remote-as external") rides on IPv6 link-local
# addressing even when it only carries IPv4 routes -- that's how the two
# ends find each other without configured addresses. This build sandbox's
# kernel has no IPv6 support at all (no /proc/sys/net/ipv6 tree, can't be
# loaded), so that specific mechanism cannot run here. Every link below
# instead gets a classic numbered /31 -- a completely real, still-common
# underlay design, just not literally "unnumbered". On any host/switch with
# IPv6 available (every real Cumulus/SONiC/FRR box), switching back is a
# one-line-per-neighbor change -- see docs/README.md "Going from numbered
# to true BGP unnumbered".
underlay_links:
  - {a: spine1, a_if: to_leaf1, a_ip: "10.255.0.0/31",  b: leaf1, b_if: to_spine1, b_ip: "10.255.0.1/31"}
  - {a: spine1, a_if: to_leaf2, a_ip: "10.255.0.2/31",  b: leaf2, b_if: to_spine1, b_ip: "10.255.0.3/31"}
  - {a: spine1, a_if: to_leaf3, a_ip: "10.255.0.4/31",  b: leaf3, b_if: to_spine1, b_ip: "10.255.0.5/31"}
  - {a: spine2, a_if: to_leaf1, a_ip: "10.255.0.6/31",  b: leaf1, b_if: to_spine2, b_ip: "10.255.0.7/31"}
  - {a: spine2, a_if: to_leaf2, a_ip: "10.255.0.8/31",  b: leaf2, b_if: to_spine2, b_ip: "10.255.0.9/31"}
  - {a: spine2, a_if: to_leaf3, a_ip: "10.255.0.10/31", b: leaf3, b_if: to_spine2, b_ip: "10.255.0.11/31"}

# Tenant VNI (overlay). All three leaves carry it; host1 is single-homed on
# leaf1, host2 is dual-homed across leaf2+leaf3 (EVPN multihoming / ESI).
overlay:
  vni: 100
  vlan: 100
  subnet: "10.100.100.0/24"
  bridge: br100
  vxlan_if: vxlan100

hosts:
  host1:
    attach: [{switch: leaf1, switch_if: to_host1, host_if: eth0}]
    ip: "10.100.100.11/24"
  host2:
    # dual-homed: two NICs bonded, one to leaf2 and one to leaf3 -- the
    # classic EVPN-multihoming access pattern (replaces an MLAG pair).
    attach:
      - {switch: leaf2, switch_if: to_host2, host_if: eth0}
      - {switch: leaf3, switch_if: to_host2, host_if: eth1}
    bond_ip: "10.100.100.12/24"
    esi: "00:00:00:00:00:00:01:02:00:64"  # shared ESI, leaf2 + leaf3
